<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OxyTrack - Oxygen Cylinder Monitoring{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column p-3">
      <div class="d-flex align-items-center mb-4 px-2">
        <i class="bi bi-shield-shaded text-info fs-3 me-2"></i>
        <span class="fs-4 fw-bold text-white tracking-wide">OxyTrack</span>
      </div>
      <hr class="text-secondary my-1">
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Live Dashboard
          </a>
        </li>
        <li>
          <a href="{{ url_for('cylinders_view') }}" class="nav-link {% if request.path == '/cylinders' %}active{% endif %}">
            <i class="bi bi-box-seam"></i> Cylinders
          </a>
        </li>
        <li>
          <a href="{{ url_for('analytics_view') }}" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
            <i class="bi bi-graph-up"></i> Analytics & Gas
          </a>
        </li>
        <li>
          <a href="{{ url_for('alerts_view') }}" class="nav-link {% if request.path == '/alerts' %}active{% endif %}">
            <i class="bi bi-bell-fill"></i> Alerts Center
          </a>
        </li>
      </ul>
      <hr class="text-secondary">
      <div class="px-2 text-muted small">
        <div><span class="pulse-indicator pulse-active"></span> System Live</div>
        <div>v1.0.0 Pro Gunicorn/MySQL</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
